[workspace]
members = ["converter-core", "converter-cli", "converter-app"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.2"
license = "MIT"

[workspace.dependencies]
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-adapter-libopus = "0.3.0"
mp3lame-encoder = "0.2.5"
audiopus = "0.2.0"
vorbis_rs = "0.5.6"
fdk-aac = "0.8.0"
flacenc = "0.5.1"
hound = "3.5.1"
id3 = "1.17.2"
metaflac = "0.2.8"
mp4ameta = "0.13.0"
mp4 = "0.14"
rubato = "5.0.1"
ogg = "0.9.2"
audioadapter-buffers = "5.2.0"
bytes = "1"
base64 = "0.22"
thiserror = "2"
log = "0.4"
anyhow = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
