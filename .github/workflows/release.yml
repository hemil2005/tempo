name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            suffix: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            suffix: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: zip
            suffix: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake libasound2-dev libopus-dev libmp3lame-dev libfontconfig1-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libwayland-dev

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VER=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VER=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VER=v0.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.VER }}"
          $dir = "tempo-$ver-windows-x64"
          New-Item -ItemType Directory -Path $dir -Force
          Copy-Item "target/${{ matrix.target }}/release/tempo.exe" -Destination "$dir\"
          Copy-Item "target/${{ matrix.target }}/release/tempo-cli.exe" -Destination "$dir\"
          Copy-Item "README.md", "LICENSE", "THIRDPARTY.md" -Destination "$dir\"
          Compress-Archive -Path "$dir\*" -DestinationPath "$dir.zip" -Force
          echo "ASSET_NAME=$dir.zip" >> $env:GITHUB_ENV

      - name: Package Linux Artifacts
        if: runner.os == 'Linux'
        run: |
          ver="${{ steps.get_version.outputs.VER }}"
          dir="tempo-$ver-linux-x64"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/tempo" "$dir/"
          cp "target/${{ matrix.target }}/release/tempo-cli" "$dir/"
          cp README.md LICENSE THIRDPARTY.md "$dir/"
          tar -czf "$dir.tar.gz" -C "$dir" .
          echo "ASSET_NAME=$dir.tar.gz" >> $GITHUB_ENV

      - name: Package macOS Artifacts
        if: runner.os == 'macOS'
        run: |
          ver="${{ steps.get_version.outputs.VER }}"
          dir="tempo-$ver-macos-arm64"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/tempo" "$dir/"
          cp "target/${{ matrix.target }}/release/tempo-cli" "$dir/"
          cp README.md LICENSE THIRDPARTY.md "$dir/"
          zip -r "$dir.zip" "$dir"
          echo "ASSET_NAME=$dir.zip" >> $GITHUB_ENV

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VER }}
          name: Tempo ${{ steps.get_version.outputs.VER }}
          files: ${{ env.ASSET_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
