name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            suffix: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            suffix: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: zip
            suffix: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libopus-dev libmp3lame-dev

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $dir = "tempo-$ver-windows-x64"
          New-Item -ItemType Directory -Path $dir
          Copy-Item "target/${{ matrix.target }}/release/tempo.exe" -Destination "$dir\"
          Copy-Item "target/${{ matrix.target }}/release/tempo-cli.exe" -Destination "$dir\"
          Copy-Item "README.md", "LICENSE", "THIRDPARTY.md" -Destination "$dir\"
          Compress-Archive -Path "$dir\*" -DestinationPath "$dir.zip"
          echo "ASSET_NAME=$dir.zip" >> $env:GITHUB_ENV

      - name: Package Linux Artifacts
        if: runner.os == 'Linux'
        run: |
          ver="${{ github.ref_name }}"
          dir="tempo-$ver-linux-x64"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/tempo" "$dir/"
          cp "target/${{ matrix.target }}/release/tempo-cli" "$dir/"
          cp README.md LICENSE THIRDPARTY.md "$dir/"
          tar -czf "$dir.tar.gz" -C "$dir" .
          echo "ASSET_NAME=$dir.tar.gz" >> $GITHUB_ENV

      - name: Package macOS Artifacts
        if: runner.os == 'macOS'
        run: |
          ver="${{ github.ref_name }}"
          dir="tempo-$ver-macos-arm64"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/tempo" "$dir/"
          cp "target/${{ matrix.target }}/release/tempo-cli" "$dir/"
          cp README.md LICENSE THIRDPARTY.md "$dir/"
          zip -r "$dir.zip" "$dir"
          echo "ASSET_NAME=$dir.zip" >> $GITHUB_ENV

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
